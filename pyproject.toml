[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadpack"
dynamic = ["version"]
description = "Compact OpenStreetMap road graphs with contraction hierarchies, for routing on microcontrollers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "NicolasDevel" }]
keywords = ["openstreetmap", "routing", "contraction-hierarchies", "embedded", "esp32", "offline-navigation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["osmium>=3.6", "numpy", "pillow"]

[project.optional-dependencies]
test = ["pytest"]
bench = ["shapely"]

[project.scripts]
roadpack = "roadpack.cli:main"

[project.urls]
Repository = "https://github.com/NicolasDevel/roadpack"

[tool.hatch.version]
path = "src/roadpack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roadpack"]

# Only what is in git: local notes, editor settings and binaries stay out
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
    "/docs",
    "/reader/*.c",
    "/reader/*.h",
    "/reader/Makefile",
    "/reader/README.md",
    "/reader/.gitignore",
    "/reader/examples",
    "/reader/tests",
    "/FORMAT.md",
    "/README.md",
    "/README.es.md",
    "/LICENSE",
]
exclude = ["/reader/main.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
